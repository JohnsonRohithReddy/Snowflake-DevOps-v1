name: Deploy Schemas

on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate schema matrix
        id: set-matrix
        run: |
          CONTROLLERS=$(python config/get_controller.py)
          echo "Schemas: $CONTROLLERS"
          [ -z "$CONTROLLERS" ] && exit 1

          MATRIX_JSON=$(python -c "
          import json, sys
          controllers = json.loads('$CONTROLLERS')
          matrix = [{'name': s, 'migrations_path': f'./{s}/migrations'} for s in controllers]
          print(json.dumps({'include': matrix}))
          ")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Select environment
        id: set-env
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "environment=sf_dev_env_cred" ;;
            test) echo "environment=sf_test_env_cred" ;;
            main) echo "environment=sf_prod_env_cred" ;;
            *)    echo "Unsupported branch" >&2; exit 1 ;;
          esac >> $GITHUB_OUTPUT

  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    environment: ${{ needs.generate-matrix.outputs.environment }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install schemachange + tomli
        run: |
          pip install schemachange tomli  # tomli is REQUIRED for connections.toml parsing in Python 3.10

      - name: Deploying ${{ matrix.name }}
        run: |
          echo "Deploying schema: ${{ matrix.name }}"
          echo "Path: ${{ matrix.migrations_path }}"

      # Write and prepare private key (must be UNENCRYPTED PKCS#8)
      - name: Install private key
        env:
          SF_PRIVATE_KEY_B64: ${{ secrets.SF_PRIVATE_KEY_B64 }}  # Base64-encoded UNENCRYPTED PKCS#8
        run: |
          mkdir -p ~/.snowflake
          echo "$SF_PRIVATE_KEY_B64" | base64 -d > ~/.snowflake/private_key.p8
          openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
            -in ~/.snowflake/private_key.p8 \
            -out ~/.snowflake/private_key.pem
          chmod 600 ~/.snowflake/private_key.pem
          echo "Private key installed and converted"

      # CRITICAL: Use correct TOML syntax that schemachange 4.x understands
      - name: Create connections.toml (Correct TOML for schemachange 4.x)
        run: |
          mkdir -p config
          cat > config/connections.toml <<EOF
          [connections.connections]
          account = "${{ secrets.SF_ACCOUNT }}"
          user = "${{ secrets.SF_USERNAME }}"
          role = "${{ secrets.SF_ROLE }}"
          warehouse = "${{ secrets.SF_WAREHOUSE }}"
          database = "${{ secrets.SF_DATABASE }}"
          private_key_path = "$HOME/.snowflake/private_key.pem"

          # Optional: explicitly disable password
          password = ""
          EOF

          echo "connections.toml created:"
          cat config/connections.toml
          chmod 600 config/connections.toml

      - name: Parse variables
        id: vars
        run: |
          VAR_FILE="${{ matrix.migrations_path }}/${{ matrix.name }}-var.yml"
          if [ -f "$VAR_FILE" ]; then
            VARS_JSON=$(python config/get_vars.py "$VAR_FILE")
          else
            VARS_JSON="{}"
          fi
          echo "VARS_JSON=$VARS_JSON" >> $GITHUB_ENV

      - name: Deploy with schemachange
        run: |
          schemachange deploy \
            --config-folder "${{ matrix.migrations_path }}/config" \
            --vars '$VARS_JSON' \
            --connections-file-path config/connections.toml \
            --connection-name connections \
            --verbose
