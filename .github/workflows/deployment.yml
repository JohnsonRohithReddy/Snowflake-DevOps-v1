name: Deploy Schemas

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate schema matrix
        id: set-matrix
        run: |
          CONTROLLERS=$(python config/get_controller.py)
          echo "Schemas found: $CONTROLLERS"
          [ -z "$CONTROLLERS" ] && echo "No schemas found!" && exit 1

          MATRIX_JSON=$(python -c "
          import json, sys
          controllers = json.loads('$CONTROLLERS')
          matrix = [{'name': s, 'migrations_path': f'./{s}/migrations'} for s in controllers]
          print(json.dumps({'include': matrix}))
          ")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Select GitHub Environment
        id: set-env
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "environment=sf_dev_env_cred" ;;
            test) echo "environment=sf_test_env_cred" ;;
            main) echo "environment=sf_prod_env_cred" ;;
            *)    echo "Unsupported branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac >> $GITHUB_OUTPUT

  # =============================================================================
  # DEPLOY JOB — Uses your existing private key directly (no conversion!)
  # =============================================================================
  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    environment: ${{ needs.generate-matrix.outputs.environment }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install schemachange + tomli
        run: |
          pip install schemachange tomli

      - name: Show deployment info
        run: |
          echo "Deploying schema: ${{ matrix.name }}"
          echo "Migrations path: ${{ matrix.migrations_path }}"

      # —————————————————————————————————————————————————————————————
      # Use your private key directly — it is already in perfect format!
      # —————————————————————————————————————————————————————————————
      - name: Install Snowflake Private Key (Direct)
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}  # Full PEM with headers
        run: |
          mkdir -p ~/.snowflake
          echo "$SF_PRIVATE_KEY" > ~/.snowflake/private_key.pem
          
          # Remove any Windows carriage returns (very common copy-paste issue)
          sed -i 's/\r$//' ~/.snowflake/private_key.pem
          
          chmod 600 ~/.snowflake/private_key.pem
          
          echo "Private key installed successfully"
          echo "Lines: $(wc -l < ~/.snowflake/private_key.pem)"
          head -1 ~/.snowflake/private_key.pem
          tail -1 ~/.snowflake/private_key.pem

      # —————————————————————————————————————————————————————————————
      # connections.toml — Correct format for schemachange 4.x
      # —————————————————————————————————————————————————————————————
      - name: Create connections.toml
        run: |
          mkdir -p config
          cat > config/connections.toml <<EOF
          [connections.connections]
          account   = "${{ secrets.SF_ACCOUNT }}"
          user      = "${{ secrets.SF_USERNAME }}"
          role      = "${{ secrets.SF_ROLE }}"
          warehouse = "${{ secrets.SF_WAREHOUSE }}"
          database  = "${{ secrets.SF_DATABASE }}"
          private_key_path = "$HOME/.snowflake/private_key.pem"
          password = ""
          EOF
          
          chmod 600 config/connections.toml
          echo "connections.toml created:"
          cat config/connections.toml

      # —————————————————————————————————————————————————————————————
      # Parse schema-specific variables (if any)
      # —————————————————————————————————————————————————————————————
      - name: Parse schema variables
        id: vars
        run: |
          VAR_FILE="${{ matrix.migrations_path }}/${{ matrix.name }}-var.yml"
          if [ -f "$VAR_FILE" ]; then
            VARS_JSON=$(python config/get_vars.py "$VAR_FILE")
            echo "Schema variables loaded from $VAR_FILE"
          else
            VARS_JSON="{}"
            echo "No -var.yml file found, using empty vars"
          fi
          echo "VARS_JSON=$VARS_JSON" >> $GITHUB_ENV

      # —————————————————————————————————————————————————————————————
      # Run schemachange
      # —————————————————————————————————————————————————————————————
      - name: Run schemachange deploy
        run: |
          schemachange deploy \
            --config-folder "${{ matrix.migrations_path }}/config" \
            --vars '$VARS_JSON' \
            --connections-file-path config/connections.toml \
            --connection-name connections \
            --verbose
