name: Deploy Schemas

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate schema matrix
        id: set-matrix
        run: |
          CONTROLLERS=$(python config/get_controller.py)
          echo "Schemas from get_controller.py: $CONTROLLERS"
          if [ -z "$CONTROLLERS" ]; then
            echo "No schemas found. Exiting."
            exit 1
          fi
          MATRIX_JSON=$(python - <<EOF
          import json
          controllers = json.loads('''$CONTROLLERS''')
          matrix = [{"name": s, "migrations_path": f"./{s}/migrations"} for s in controllers]
          print(json.dumps({"include": matrix}))
          EOF
          )
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Select environment based on branch
        id: set-env
        run: |
          case "${{ github.ref_name }}" in
            dev)   echo "environment=sf_dev_env_cred" ;;
            test)  echo "environment=sf_test_env_cred" ;;
            main)  echo "environment=sf_prod_env_cred" ;;
            *)     echo "Unsupported branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac >> $GITHUB_OUTPUT

  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    environment: ${{ needs.generate-matrix.outputs.environment }}
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install schemachange tomli snowflake-connector-python[pandas,secure-local-storage]

      - name: Install Snowflake Private Key
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          echo "$SF_PRIVATE_KEY" > ~/.snowflake/private_key.pem
          chmod 600 ~/.snowflake/private_key.pem

      - name: Create schemachange connections.toml (secure + modern)
        run: |
          mkdir -p ~/.schemachange
          cat > ~/.schemachange/connections.toml <<EOF
          [default]
          account          = "${{ secrets.SF_ACCOUNT }}"
          user             = "${{ secrets.SF_USERNAME }}"
          role             = "${{ secrets.SF_ROLE }}"
          warehouse        = "${{ secrets.SF_WAREHOUSE }}"
          database         = "${{ secrets.SF_DATABASE }}"
          schema           = "${{ matrix.name }}"
          private_key_file = "/home/runner/.snowflake/private_key.pem"
          EOF
          chmod 600 ~/.schemachange/connections.toml

      - name: Create target schema (prevents USE SCHEMA failure)
        env:
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME:  ${{ secrets.SF_USERNAME }}
          SF_ROLE:      ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:  ${{ secrets.SF_DATABASE }}
          TARGET_SCHEMA: ${{ matrix.name }}
        run: |
          python - <<EOF
          import os, snowflake.connector, base64
          from cryptography.hazmat.primitives import serialization

          pkey_bytes = open("/home/runner/.snowflake/private_key.pem", "rb").read()
          pkey = serialization.load_pem_private_key(pkey_bytes, password=None)

          conn = snowflake.connector.connect(
              account=os.getenv("SF_ACCOUNT"),
              user=os.getenv("SF_USERNAME"),
              private_key=pkey.serialize(),
              role=os.getenv("SF_ROLE"),
              warehouse=os.getenv("SF_WAREHOUSE"),
              database=os.getenv("SF_DATABASE"),
          )
          cur = conn.cursor()
          cur.execute(f"USE ROLE {os.getenv('SF_ROLE')}")
          cur.execute(f"USE WAREHOUSE {os.getenv('SF_WAREHOUSE')}")
          cur.execute(f"USE DATABASE {os.getenv('SF_DATABASE')}")
          cur.execute(f"CREATE SCHEMA IF NOT EXISTS {os.getenv('SF_DATABASE')}.{os.getenv('TARGET_SCHEMA')}")
          print(f"Schema {os.getenv('SF_DATABASE')}.{os.getenv('TARGET_SCHEMA')} ready")
          cur.close()
          conn.close()
          EOF

      - name: Prepare variables file
        id: parse-vars
        run: |
          VAR_FILE="${{ matrix.migrations_path }}/${{ matrix.name }}-var.yml"
          if [ ! -f "$VAR_FILE" ]; then
            echo "{}" > /tmp/vars.json
          else
            python config/get_vars.py "$VAR_FILE" > /tmp/vars.json
          fi
          echo "vars-file=/tmp/vars.json" >> $GITHUB_OUTPUT

      - name: Disable per-schema schemachange-config.yml
        run: |
          CONFIG="${{ matrix.migrations_path }}/config/schemachange-config.yml"
          [ -f "$CONFIG" ] && mv "$CONFIG" "$CONFIG.disabled_by_ci" || true

      - name: Deploy with schemachange 4.1.0
        run: |
          VARS_JSON=$(python -c "import json,sys; print(json.dumps(json.load(open('/tmp/vars.json'))))")

          schemachange deploy \
            --config-folder ~/.schemachange \
            --schemachange-connections-file-path ~/.schemachange/connections.toml \
            --connection-name default \
            --schemachange-root-folder "${{ matrix.migrations_path }}" \
            --schemachange-modules-folder "${{ matrix.migrations_path }}/config" \
            --schemachange-vars "$VARS_JSON" \
            --schemachange-change-history-table "${{ secrets.SF_DATABASE }}.SCHEMACHANGE.CHANGE_HISTORY" \
            --schemachange-create-change-history-table \
            --log-level DEBUG
