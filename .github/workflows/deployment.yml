name: Deploy Schemas

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate schema matrix
        id: set-matrix
        run: |
          CONTROLLERS=$(python config/get_controller.py)
          echo "Schemas from get_controller.py: $CONTROLLERS"
          if [ -z "$CONTROLLERS" ]; then
            echo "No schemas found. Exiting."
            exit 1
          fi
          MATRIX_JSON=$(python - <<EOF
          import json
          controllers = json.loads('''$CONTROLLERS''')
          matrix = [{"name": s, "migrations_path": f"./{s}/migrations"} for s in controllers]
          print(json.dumps({"include": matrix}))
          EOF
          )
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Select environment based on branch
        id: set-env
        run: |
          case "${{ github.ref_name }}" in
            dev)   echo "environment=sf_dev_env_cred" ;;
            test)  echo "environment=sf_test_env_cred" ;;
            main)  echo "environment=sf_prod_env_cred" ;;
            *)     echo "Unsupported branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac >> $GITHUB_OUTPUT

      - name: Log selected environment
        run: |
          echo "Selected GitHub environment: ${{ steps.set-env.outputs.environment }}"

  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    environment: ${{ needs.generate-matrix.outputs.environment }}
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install schemachange + tomli + snowflake-connector
        run: pip install schemachange tomli snowflake-connector-python[pkey]

      - name: Install Snowflake Private Key
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          echo "$SF_PRIVATE_KEY" > ~/.snowflake/private_key.pem
          chmod 600 ~/.snowflake/private_key.pem
          echo "Private key installed"

      - name: Create schemachange connections.toml (secure + modern)
        run: |
          mkdir -p ~/.schemachange
          cat > ~/.schemachange/connections.toml <<EOF
          [default]
          account          = "${{ secrets.SF_ACCOUNT }}"
          user             = "${{ secrets.SF_USERNAME }}"
          role             = "${{ secrets.SF_ROLE }}"
          warehouse        = "${{ secrets.SF_WAREHOUSE }}"
          database         = "${{ secrets.SF_DATABASE }}"
          schema           = "${{ matrix.name }}"
          private_key_file = "/home/runner/.snowflake/private_key.pem"
          EOF
          chmod 600 ~/.schemachange/connections.toml
          echo "connections.toml created with schema = ${{ matrix.name }}"

      - name: Create target schema (prevents USE SCHEMA failure)
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
        run: |
          python - <<EOF
          import snowflake.connector
          from snowflake.connector import Error

          # Load private key
          with open('/home/runner/.snowflake/private_key.pem', 'r') as f:
              pkey = f.read()

          try:
              # Connect to Snowflake
              conn = snowflake.connector.connect(
                  account=env['SF_ACCOUNT'],
                  user=env['SF_USERNAME'],
                  role=env['SF_ROLE'],
                  warehouse=env['SF_WAREHOUSE'],
                  database=env['SF_DATABASE'],
                  private_key=pkey
              )
              cur = conn.cursor()

              # Set context and create schema if not exists
              cur.execute(f"USE ROLE {env['SF_ROLE']}")
              cur.execute(f"USE WAREHOUSE {env['SF_WAREHOUSE']}")
              cur.execute(f"USE DATABASE {env['SF_DATABASE']}")
              cur.execute(f"CREATE SCHEMA IF NOT EXISTS {env['SF_DATABASE']}.{env['matrix_name']}")
              print(f"✅ Schema '{env['SF_DATABASE']}.{env['matrix_name']}' created or verified.")

              # Optional: Grant USAGE if needed (uncomment if permission issues persist)
              # cur.execute(f"GRANT USAGE ON DATABASE {env['SF_DATABASE']} TO ROLE {env['SF_ROLE']}")
              # cur.execute(f"GRANT CREATE SCHEMA ON DATABASE {env['SF_DATABASE']} TO ROLE {env['SF_ROLE']}")
              # print(f"✅ Granted USAGE on database to role {env['SF_ROLE']}")

              cur.close()
              conn.close()
          except Error as e:
              print(f"❌ Error creating schema: {e}")
              exit(1)
          EOF
          # Note: env vars are auto-available in run:, but matrix.name needs manual pass
        env:
          matrix_name: ${{ matrix.name }}

      - name: Prepare variables file (if exists)
        id: parse-vars
        run: |
          VAR_FILE="${{ matrix.migrations_path }}/${{ matrix.name }}-var.yml"
          if [ ! -f "$VAR_FILE" ]; then
            echo "No var file found for ${{ matrix.name }} → using empty vars"
            echo "{}" > /tmp/vars.json
          else
            echo "Found var file: $VAR_FILE"
            python config/get_vars.py "$VAR_FILE" > /tmp/vars.json
          fi
          cat /tmp/vars.json
          echo "vars-file=/tmp/vars.json" >> $GITHUB_OUTPUT

      - name: Disable schemachange-config.yml to avoid Jinja rendering errors
        run: |
          CONFIG_FILE="${{ matrix.migrations_path }}/config/schemachange-config.yml"
          if [ -f "$CONFIG_FILE" ]; then
            mv "$CONFIG_FILE" "$CONFIG_FILE.disabled_by_ci"
            echo "Disabled schemachange-config.yml to prevent 'database_name undefined'"
          fi

      - name: Deploy schema with schemachange 4.1.0
        run: |
          echo "Deploying schema: ${{ matrix.name }}"
          echo "Root folder: ${{ matrix.migrations_path }}"

          VARS_JSON=$(cat /tmp/vars.json | python -c "import json, sys; print(json.dumps(json.load(sys.stdin)))")

          schemachange deploy \
            --config-folder ~/.schemachange \
            --schemachange-connections-file-path ~/.schemachange/connections.toml \
            --connection-name default \
            --schemachange-root-folder "${{ matrix.migrations_path }}" \
            --schemachange-modules-folder "${{ matrix.migrations_path }}/config" \
            --schemachange-vars "$VARS_JSON" \
            --schemachange-change-history-table "${{ secrets.SF_DATABASE }}.SCHEMACHANGE.CHANGE_HISTORY" \
            --schemachange-create-change-history-table \
            --log-level DEBUG
