name: Deploy Schemas

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Generate schema matrix
        id: set-matrix
        run: |
          CONTROLLERS=$(python config/get_controller.py)
          echo "Schemas: $CONTROLLERS"
          [ -z "$CONTROLLERS" ] && exit 1
          MATRIX_JSON=$(python - <<EOF
          import json
          controllers = json.loads('''$CONTROLLERS''')
          matrix = [{"name": s, "migrations_path": f"./{s}/migrations"} for s in controllers]
          print(json.dumps({"include": matrix}))
          EOF
          )
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
      - name: Select environment
        id: set-env
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "environment=sf_dev_env_cred" ;;
            test) echo "environment=sf_test_env_cred" ;;
            main) echo "environment=sf_prod_env_cred" ;;
            *)    echo "Unsupported branch" >&2; exit 1 ;;
          esac >> $GITHUB_OUTPUT

  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    environment: ${{ needs.generate-matrix.outputs.environment }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install schemachange + tomli
        run: pip install schemachange tomli

      - name: Deploying ${{ matrix.name }}
        run: |
          echo "Deploying schema: ${{ matrix.name }}"
          echo "Path: ${{ matrix.migrations_path }}"

      # 1. Private Key — works with your existing key
      - name: Install Private Key
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          echo "$SF_PRIVATE_KEY" > ~/.snowflake/private_key.pem
          sed -i 's/\r$//' ~/.snowflake/private_key.pem
          chmod 600 ~/.snowflake/private_key.pem

      # 2. connections.toml — correct format for schemachange 4.x
      - name: Create connections.toml
        run: |
          mkdir -p config
          cat > config/connections.toml <<EOF
          [connections.connections]
          account          = "${{ secrets.SF_ACCOUNT }}"
          user             = "${{ secrets.SF_USERNAME }}"
          role             = "${{ secrets.SF_ROLE }}"
          warehouse        = "${{ secrets.SF_WAREHOUSE }}"
          database         = "${{ secrets.SF_DATABASE }}"
          private_key_path = "$HOME/.snowflake/private_key.pem"
          password         = ""
          EOF
          chmod 600 config/connections.toml

      # 3. Parse variables — THE REAL FIX (outputs proper JSON)
      - name: Parse variables (FINAL FIX)
        run: |
          VAR_FILE="${{ matrix.migrations_path }}/${{ matrix.name }}-var.yml"
          
          if [ ! -f "$VAR_FILE" ]; then
            echo "No var file → using {}"
            echo "VARS_JSON={}" >> $GITHUB_ENV
            exit 0
          fi

          # This is the magic line — forces clean JSON output
          CLEAN_JSON=$(python -c "
import json
import sys
sys.path.append('config')
import get_vars
raw = get_vars.main('$VAR_FILE') if hasattr(get_vars, 'main') else get_vars.get_vars('$VAR_FILE')
# or if your script just prints, use: raw = eval(open('$VAR_FILE').read())['variables']
print(json.dumps(raw))
          ")

          echo "Clean JSON for schemachange: $CLEAN_JSON"
          echo "VARS_JSON=$CLEAN_JSON" >> $GITHUB_ENV

      # 4. Deploy — NO QUOTES!
      - name: Run schemachange deploy
        run: |
          schemachange deploy \
            --config-folder "${{ matrix.migrations_path }}/config" \
            --vars $VARS_JSON \
            --connections-file-path config/connections.toml \
            --connection-name connections \
            --verbose
